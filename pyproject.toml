[project]
name = "proxy-subscription-builder"
version = "0.1.0"
description = "Collect, validate, filter and publish proxy subscriptions."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
proxy-builder = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]