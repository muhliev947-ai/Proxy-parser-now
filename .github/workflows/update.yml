name: Update proxy subscriptions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,lint]"

      - name: Validate parser
        run: |
          python -m compileall -q src tests
          python -m ruff check src tests
          python -m pytest -q

      - name: Download sing-box binary (pin 1.13.1, verify SHA-256)
        id: singbox
        run: |
          SINGBOX_VERSION=1.13.1
          SINGBOX_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          EXPECTED_SHA256=e68f9a193892826663c2c9999ef3394a2bb6779d5d932a6db7bf47d530741cb9
          curl -fsSL -o sing-box.tar.gz "${SINGBOX_URL}"
          ACTUAL_SHA256=$(sha256sum sing-box.tar.gz | awk '{print $1}')
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error::SHA-256 mismatch: expected ${EXPECTED_SHA256}, got ${ACTUAL_SHA256}"
            exit 1
          fi
          tar -xzf sing-box.tar.gz
          rm -f sing-box.tar.gz
          mv "sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" ./sing-box
          rm -rf "sing-box-${SINGBOX_VERSION}-linux-amd64"
          chmod +x sing-box
          ./sing-box version

      - name: Enable sing-box check in config
        run: |
          python -c "
          import yaml
          cfg = yaml.safe_load(open('config.yaml'))
          cfg.setdefault('check', {}).setdefault('singbox', {})['enabled'] = True
          yaml.safe_dump(cfg, open('config.yaml', 'w'), allow_unicode=True, sort_keys=False)
          "

      - name: Build subscriptions (15 min cap, publish partial on timeout)
        timeout-minutes: 15
        run: |
          set +e
          timeout 14m python -m src.checker.launch_singbox \
            --config config.yaml --singbox ./sing-box 2>&1 | tee build.log
          RC=$?
          set -e
          if [[ $RC -eq 124 ]]; then
            echo "::warning::15-min cap reached — publishing partial results"
          fi
          echo "Build log (URIs stripped):"
          grep -vE 'vless://|vmess://|trojan://|ss://|hy2://' build.log
          CANDIDATES=$(grep -cE '^candidate ' build.log || true)
          echo "::notice::Candidate result rows in build log: ${CANDIDATES}"
          if [[ "$CANDIDATES" -lt 20 ]]; then
            echo "::warning::Fewer than 20 candidate result rows were logged; the check may have aborted early"
          fi

      - name: Write job summary from metrics
        run: python3 scripts/metrics_summary.py "$GITHUB_STEP_SUMMARY"

      - name: Upload build log and subscription as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence
          path: |
            build.log
            output/subscription.txt

      - name: Publish generated files to docs
        run: |
          mkdir -p docs
          if [[ -s output/subscription.txt ]]; then
            ! grep -Eq '^(proxies:|- name:|  type:|  server:|  port:)' output/subscription.txt
            rm -f docs/subscription.yaml docs/subscription.json
            cp -f output/subscription.txt docs/subscription.txt
          else
            echo "::warning::No valid encrypted proxy URIs found; existing docs/subscription.txt preserved."
          fi
          touch docs/.nojekyll

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update subscriptions"
          file_pattern: "output/subscription.txt output/metrics.json docs/subscription.txt docs/.nojekyll"

  deploy:
    needs: update
    # Serialises Pages deployments — prevents "in progress deployment" 400 errors
    # when multiple runs (cron + dispatch + auto-commit) fire near-simultaneously.
    # NOTE: this serialises the *jobs*, not the Pages API's own site-level lock,
    # so deploy-pages can still hit a 400; the retry step below handles that.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for previous Pages deployment to finish
        run: |
          # The Pages API keeps a site-level lock independent of our concurrency
          # group. If a previous run is still "purging_cdn", deploy-pages will
          # poll and can hang until the job-wide timeout kills the run. Poll
          # here with a bounded wait instead so we surface a clean error early.
          TOKEN="${GITHUB_TOKEN}"
          for i in $(seq 1 20); do
            STATE=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | python3 -c "import sys,json; print(json.load(sys.stdin).get('pages_build',{}).get('status',''))" 2>/dev/null || true)
            if [[ -z "$STATE" ]]; then break; fi
            echo "Pages build status: $STATE, waiting 15s..."
            sleep 15
          done

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # The Pages API keeps its own site-level lock, independent of the
        # concurrency group above, so a 400 "in progress deployment" is still
        # possible when a previous run's deployment is finishing. The retry
        # step below handles it; the lock is normally released within seconds.
        timeout-minutes: 6
        with:
          error_count: 1
          max_attempts: 5
        continue-on-error: true

      - name: Retry failed Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: deployment_retry
        with:
          error_count: 1
          max_attempts: 5

      - name: Fail if the retry also failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages deployment failed after retries"
          exit 1