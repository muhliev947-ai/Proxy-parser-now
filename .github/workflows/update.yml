name: Update proxy subscriptions

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m src.main --verbose
      - run: mkdir -p docs && cp output/subscription.* docs/
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update subscriptions"
          file_pattern: output/* docs/*