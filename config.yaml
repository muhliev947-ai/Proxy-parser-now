fallback_file: sample_proxies.txt

# Публичные источники. raw.githubusercontent.com недоступен из этой сети,
# поэтому используется зеркало jsDelivr (cdn.jsdelivr.net/gh/<owner>/<repo>@<branch>/<path>).
sources:
  # Рабочий источник: узлы прошли реальную проверку через запущенный Hiddify
  # (sing-box 1.13.1, Clash API). raw.githubusercontent.com и gh-proxy.com
  # недоступны из этой сети, поэтому используется зеркало jsDelivr.
  - https://cdn.jsdelivr.net/gh/Ruk1ng001/freeSub@main/v2ray
  # Верифицированные узлы (реальный проксированный запрос прошел проверку во всех запусках)
  - https://cdn.jsdelivr.net/gh/0xRadikal/Free-v2ray-Configs@main/verified/configs.txt
  - https://cdn.jsdelivr.net/gh/Au1rxx/free-vpn-subscriptions@main/output/v2ray-base64.txt
  # Крупные агрегаторы, обновляемые автоматически
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/subscriptions/mix-normal.txt
  - https://cdn.jsdelivr.net/gh/teknovpnhub/v2ray-subscription@main/servers.txt
  - https://cdn.jsdelivr.net/gh/idtheo/V2Ray-CleanIPs-Servers@main/shield.txt
  - https://cdn.jsdelivr.net/gh/RKPchannel/RKP_bypass_configs@main/sources.txt
  # Агрегаторы общего назначения
  - https://cdn.jsdelivr.net/gh/mahdibland/V2RayAggregator@master/sub/sub_merge.txt
  - https://cdn.jsdelivr.net/gh/mahdibland/V2RayAggregator@master/Eternity.txt
  - https://cdn.jsdelivr.net/gh/peasoft/NoMoreWalls@master/list.txt
  - https://cdn.jsdelivr.net/gh/Epodonios/v2ray-configs@main/All_Configs_Sub.txt
  - https://cdn.jsdelivr.net/gh/Epodonios/v2ray-configs@main/Sub1.txt
  - https://cdn.jsdelivr.net/gh/Epodonios/v2ray-configs@main/Sub2.txt
  # Разбивка по протоколам (MustafaBaqer/VestraNet-Nodes)
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/protocols/vless.txt
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/protocols/vmess.txt
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/protocols/trojan.txt
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/protocols/shadowsocks.txt
  - https://cdn.jsdelivr.net/gh/MustafaBaqer/VestraNet-Nodes@main/protocols/hy2.txt
  # Разбивка по протоколам (Leon406/SubCrawler)
  - https://cdn.jsdelivr.net/gh/Leon406/SubCrawler@main/sub/share/v2
  - https://cdn.jsdelivr.net/gh/Leon406/SubCrawler@main/sub/share/vless
  - https://cdn.jsdelivr.net/gh/Leon406/SubCrawler@main/sub/share/tr
  - https://cdn.jsdelivr.net/gh/Leon406/SubCrawler@main/sub/share/ss
  - https://cdn.jsdelivr.net/gh/Leon406/SubCrawler@main/sub/share/hysteria2
  # Прочие публичные подписки
  - https://cdn.jsdelivr.net/gh/ts-sf/fly@main/v2
  - https://cdn.jsdelivr.net/gh/ermaozi/get_subscribe@main/subscribe/v2ray.txt
  - https://cdn.jsdelivr.net/gh/Pawdroid/Free-servers@main/sub
  - https://cdn.jsdelivr.net/gh/ripaojiedian/freenode@main/sub
  # Новые агрегаторы (верифицированы: парсятся и отдают узлы)
  # cbusifabcap/daily_free_vpn — Z.txt: ~417 узлов (vless/trojan), зеркало
  # с 1 коммитом ("Initial sync"). Живучесть НЕ подтверждена историей —
  # перепроверить через неделю; если коммитов больше нет, удалить.
  - https://cdn.jsdelivr.net/gh/cbusifabcap/daily_free_vpn@master/Z.txt
  # Alirewa/V2ray-Configs — sub1.txt: ~100 узлов (trojan/vless, base64).
  # Авто-бот "🔄 auto-update configs", 4–6 коммитов в день, 3 мес. истории.
  - https://cdn.jsdelivr.net/gh/Alirewa/V2ray-Configs@master/sub1.txt
  # mfuu/v2ray — крупный автообновляемый Clash-YAML (1015 узлов: ss/vmess/trojan).
  # Файл содержит битые flow-mappings с вложенными кавычками, поэтому парсер
  # теперь восстанавливает валидные записи построчно, а не отбрасывает весь файл.
  - https://cdn.jsdelivr.net/gh/mfuu/v2ray@master/sub.yaml
  # free18/v2ray — Base64-подписка (vless/trojan), обновляется автоматически.
  - https://cdn.jsdelivr.net/gh/free18/v2ray@main/v.txt
  # freefq/free — компактная Base64-подписка (ss).
  - https://cdn.jsdelivr.net/gh/freefq/free@master/v2
  - sample_proxies.txt

freshness_days: 7
countries: []
types: [vless, vmess, trojan, ss, hy2]
protocols: []
min_speed_kbps: 0
check:
  enabled: true
  require_protocol_handshake: true
  # Реальная проверка через Clash API запущенного Hiddify (127.0.0.1:16756).
  # Если Hiddify не запущен, узлы не публикуются как рабочие.
  clash_api_url: http://127.0.0.1:16756
  clash_api_secret: MkueO0owlZajEXK7
  # Проверка реального HTTP-статуса через SOCKS-инбаунд Hiddify.
  # Clash API отдаёт задержку даже для 404/500, поэтому статус проверяется отдельно.
  socks_proxy_url: socks5h://127.0.0.1:12334
  expected_status: 204
  max_candidates: 500
  timeout_seconds: 5
  concurrency: 16
  # Максимальная глубина урезания батча (batch halving) в LocalSingBoxBackend:
  # 2^N единичных батчей до полного отказа. По умолчанию 8 (до 256 батчей).
  max_halving_depth: 8
  urls: [https://cp.cloudflare.com/generate_204]
  # Пул рабочих узлов: проверка продолжается, пока не наберётся min_working_nodes
  # живых узлов (или пока не кончатся кандидаты). Бесплатные прокси умирают за
  # часы, поэтому один узел — хрупкая подписка.
  min_working_nodes: 5
  # Верхняя граница общего числа проверяемых кандидатов, чтобы мёртвая сеть
  # не затянула прогон на часы. По умолчанию 4x от max_candidates.
  max_total_candidates: 2000
  # Финальная перепроверка топовых узлов прямо перед записью подписки:
  # узел, живой минуту назад, мог уже умереть.
  reverify_before_publish: true
  reverify_top_n: 10
output:
  directory: output
  formats: [plaintext]
  sort_by_latency: true   # сортировка узлов по задержке (быстрые первыми)
  include_unchecked: false