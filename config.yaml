sources:
  # Production-safe setup: prefer GitHub repo sources, but keep a local fallback so the build
  # does not fail when the public feeds are blocked or are temporarily unavailable.
  - github:hiztin/VLESS-PO-GRIBI
  - github:mahdibland/V2RayAggregator
  - github:Alvin9999/pac2
  - github:peasoft/NoMoreWalls
  - github:zhangkaiyulw/Proxy-List
  - sample_proxies.txt

freshness_days: 7
countries: []          # Empty means any country.
types: [vless, vmess, trojan, shadowsocks, hysteria2]
protocols: []          # reality, xhttp, grpc, ws, etc.
min_speed_kbps: 0      # keep valid entries in this environment
check:
  enabled: false        # disabled by default so the build remains deterministic
  timeout_seconds: 5
  concurrency: 8
  urls: [https://www.gstatic.com/generate_204, https://cp.cloudflare.com/generate_204]
output:
  directory: output
  formats: [clash, singbox]
  include_unchecked: true